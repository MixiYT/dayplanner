[package]
name = "planner-server"
version = "0.1.0"
edition = "2021"
description = "Сервер рейтинга пользователей ежедневника"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
