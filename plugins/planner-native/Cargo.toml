[package]
name = "tauri-plugin-planner-native"
version = "0.1.0"
edition = "2021"
description = "Системная часть ежедневника: будильники, уведомления, полноэкранные напоминания и виджеты Android"
links = "tauri-plugin-planner-native"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
