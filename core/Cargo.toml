[package]
name = "planner-core"
version = "0.1.0"
edition = "2021"
description = "Ядро ежедневника: расписания, напоминания, выполнение, достижения"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
